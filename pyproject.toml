[project]
name = "quickshell-docs-mcp"
version = "1.2.0"
description = "MCP server that fetches live Quickshell docs from quickshell.org so the model reads real, current docs instead of hallucinating."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Frank" }]
keywords = ["mcp", "model-context-protocol", "quickshell", "qml", "wayland", "documentation", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.urls]
Homepage = "https://github.com/franklinnolasco7/quickshell-docs-mcp"
Repository = "https://github.com/franklinnolasco7/quickshell-docs-mcp"
Issues = "https://github.com/franklinnolasco7/quickshell-docs-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=6",
]

[project.scripts]
quickshell-docs-mcp = "quickshell_docs_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quickshell_docs_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real quickshell.org network (opt in with QUICKSHELL_DOCS_LIVE_TEST=1)",
]
