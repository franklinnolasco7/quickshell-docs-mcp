name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check flake
        run: |
          nix flake check
          nix flake show --all-systems --json >/dev/null

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Nix package
        run: nix build

      - name: Test package runs
        run: |
          timeout 5s ./result/bin/quickshell-docs-mcp || true

      - name: Build Python distribution
        run: |
          nix develop --command python -m build --no-isolation
          ls -la dist/

      - name: Validate package metadata
        run: nix develop --command twine check dist/*

  lint:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Lint with ruff
        run: |
          nix develop --command ruff check quickshell_docs_mcp/ tests/ scripts/
          nix develop --command ruff format --check quickshell_docs_mcp/ tests/ scripts/

      - name: Type check with mypy
        run: nix develop --command mypy quickshell_docs_mcp/

  test:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run tests (offline suite + code-quality gates)
        run: |
          nix develop --command pytest tests/ -v -n auto \
            --cov=quickshell_docs_mcp --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: franklinnolasco7/quickshell-docs-mcp
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t quickshell-docs-mcp .

      - name: Smoke-run image over stdio
        run: |
          docker run --rm -i -d --name qs-smoke quickshell-docs-mcp &
          sleep 3
          docker stop qs-smoke >/dev/null

  live-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Live smoke test against quickshell.org
        run: QUICKSHELL_DOCS_LIVE_TEST=1 pytest -m live -q
