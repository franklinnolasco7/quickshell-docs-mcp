name: Semantic release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build and publish"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: semantic-release

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.sr.outputs.released }}
      version: ${{ steps.sr.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install semantic-release and plugins
        if: github.event_name == 'push'
        run: |
          npm install --no-save \
            semantic-release@^25 \
            @semantic-release/git@^11 \
            @semantic-release/exec@^7 \
            "@google/semantic-release-replace-plugin@^1.2.7"

      - name: Release
        id: sr
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release

  publish:
    needs: semantic-release
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      version: ${{ steps.meta.outputs.version }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.semantic-release.outputs.released == 'true'
    steps:
      - name: Resolve version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          SR_VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          TAG="${INPUT_TAG:-$SR_VERSION}"
          if [ -z "$TAG" ]; then
            echo "::error::No version resolved. On workflow_dispatch you must pass the tag input (e.g. v1.0.0); push triggers get it from semantic-release."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: "v${{ steps.meta.outputs.version }}"
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build Python distribution
        run: |
          nix develop --command python -m build --no-isolation
          ls -la dist/

      - name: Validate package metadata
        run: nix develop --command twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    name: Publish to MCP Registry
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v6
        with:
          ref: "v${{ needs.publish.outputs.version }}"
          persist-credentials: false

      - name: Set server version from release
        env:
          VERSION: "${{ needs.publish.outputs.version }}"
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ["VERSION"]
          p = "server.json"
          d = json.load(open(p))
          d["version"] = v
          d["packages"][0]["version"] = v
          json.dump(d, open(p, "w"), indent=2)
          print("server.json version ->", v)
          PY

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Wait for PyPI propagation
        run: sleep 60

      - name: Validate server.json
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("server.json"))
          assert len(d["description"]) <= 100, (
              f"description too long: {len(d['description'])} chars (limit 100)"
          )
          print("server.json description OK")
          PY
          ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
